name: Pre-commit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: precommit-servicems-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pre-commit/action@v3.0.1

  phase3-format-and-test:
    name: Phase 3 formatting and frontend tests (temporary)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 67
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned formatting tools
        run: |
          python -m pip install ruff==0.13.2
          npm install -g prettier@2.7.1
      - name: Apply formatting
        run: |
          ruff check --select I --fix servicems/
          ruff check --fix servicems/
          ruff format servicems/
          find frontend/src servicems -type f \( -name '*.vue' -o -name '*.js' \) -not -path '*/public/*' -print0 | xargs -0 -r prettier --write
      - name: Commit formatter output to PR branch
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add frontend/src servicems/api servicems/service_management/page
            git commit -m 'style(bookings): apply pinned formatters'
            git push origin HEAD:refs/heads/feat/v16-booking-calendar-responsive
          fi
      - name: Frontend calendar unit tests
        working-directory: frontend
        run: |
          npm install --no-save date-fns@2
          node --test tests/calendarViews.test.mjs
