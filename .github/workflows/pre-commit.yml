name: Pre-commit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: precommit-servicems-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pre-commit/action@v3.0.1

  phase3-visual-format-and-build:
    name: Phase 3 visual formatting and frontend build (temporary)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 67
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned frontend formatter
        run: npm install -g prettier@2.7.1
      - name: Format Phase 3 frontend and Desk page
        run: |
          prettier --write frontend/src/components/BookingCalendar.vue frontend/src/index.css servicems/service_management/page/service_booking_calendar/service_booking_calendar.js
      - name: Commit formatting on feature branch only
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add frontend/src/components/BookingCalendar.vue frontend/src/index.css servicems/service_management/page/service_booking_calendar/service_booking_calendar.js
            git commit -m 'style(bookings): format theme and month calendar'
            git push origin HEAD:refs/heads/feat/v16-booking-calendar-responsive
          fi
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          corepack enable
          yarn install
          node --test tests/*.test.mjs
          yarn build
