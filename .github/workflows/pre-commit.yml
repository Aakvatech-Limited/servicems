name: Pre-commit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: precommit-servicems-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pre-commit/action@v3.0.1

  phase3b-format-and-frontend:
    name: Phase 3B format and frontend verification (temporary)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 68
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned formatters
        run: |
          python -m pip install ruff==0.13.2
          npm install -g prettier@2.7.1
      - name: Format only Phase 3B changed sources
        run: |
          ruff check --select I --fix servicems/field_api.py servicems/field_permissions.py servicems/www/field.py servicems/service_management/doctype/service_vehicle_inspection/service_vehicle_inspection.py servicems/service_management/doctype/service_vehicle_inspection/test_service_vehicle_inspection.py
          ruff check --fix servicems/field_api.py servicems/field_permissions.py servicems/www/field.py servicems/service_management/doctype/service_vehicle_inspection/service_vehicle_inspection.py servicems/service_management/doctype/service_vehicle_inspection/test_service_vehicle_inspection.py
          ruff format servicems/field_api.py servicems/field_permissions.py servicems/www/field.py servicems/service_management/doctype/service_vehicle_inspection/service_vehicle_inspection.py servicems/service_management/doctype/service_vehicle_inspection/test_service_vehicle_inspection.py
          prettier --write frontend/src/field/api.js frontend/src/field/main.js frontend/src/field/FieldApp.vue frontend/src/field/style.css frontend/vite.config.js servicems/service_management/doctype/service_job_card/service_job_card.js
      - name: Commit formatting on feature branch only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/src/field frontend/vite.config.js servicems/field_api.py servicems/field_permissions.py servicems/www/field.py servicems/service_management/doctype/service_vehicle_inspection servicems/service_management/doctype/service_job_card/service_job_card.js
            git commit -m "style(field): apply repository formatters"
            git push origin HEAD:refs/heads/feat/v16-field-pwa-inspections
          fi
      - name: Run frontend helper tests and build
        working-directory: frontend
        run: |
          corepack enable
          yarn install
          node --test tests/*.test.mjs
          yarn build
