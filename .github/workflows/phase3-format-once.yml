name: Phase 3 One-Time Formatting

on:
  push:
    branches:
      - feat/v16-booking-calendar-responsive

permissions:
  contents: write

jobs:
  apply-format:
    if: github.event.head_commit.message != 'style(bookings): apply pinned repository formatters'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned formatters
        run: |
          python -m pip install 'ruff==0.13.2' 'pre-commit==4.3.0'
          npm install -g 'prettier@2.7.1'
      - name: Apply Ruff and Prettier formatting only
        run: |
          ruff check --select I --fix servicems/
          ruff check --fix servicems/
          ruff format servicems/
          git ls-files -z 'frontend/**/*.vue' 'frontend/**/*.js' 'servicems/**/*.js' | xargs -0 -r prettier --write
      - name: Commit formatting on feature branch only
        run: |
          git status --short
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add servicems frontend
            git commit -m "style(bookings): apply pinned repository formatters"
            git push origin "HEAD:refs/heads/feat/v16-booking-calendar-responsive"
          fi
